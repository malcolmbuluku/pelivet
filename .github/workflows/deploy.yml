# Continuous deployment — push to main -> SSH to the droplet -> pull & restart.
# Mirrors the pabesh.online pipeline.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   DROPLET_HOST  = 138.68.185.223
#   DROPLET_USER  = thebuluku
#   SSH_KEY       = the matching private key (deploy key)

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd ~/pelivet
            git pull origin main
            source .venv/bin/activate
            pip install -r requirements.txt
            python seed.py            # refresh content (safe: won't touch bookings)
            sudo systemctl restart pelivet
            echo "Deployed at $(date)"
