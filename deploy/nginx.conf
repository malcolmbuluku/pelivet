# Nginx site config — copy to /etc/nginx/sites-available/pelivet
# then: sudo ln -s /etc/nginx/sites-available/pelivet /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx
# Finally add HTTPS:  sudo certbot --nginx -d pelivet.co.ke -d www.pelivet.co.ke
# (Certbot rewrites this file to add the TLS listener and redirect.)

server {
    listen 80;
    server_name pelivet.co.ke www.pelivet.co.ke;

    # Serve static assets directly (faster, skips Gunicorn)
    location /static/ {
        alias /home/thebuluku/pelivet/static/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }

    location /favicon.png {
        alias /home/thebuluku/pelivet/static/img/favicon.png;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    client_max_body_size 8M;
}
