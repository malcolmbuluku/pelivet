<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin sign in — {{ clinic.name }}</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon.png') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="admin-body">
  {% include 'partials/_flash.html' %}
  <div class="admin-login-wrap">
    <div class="admin-login">
      <a href="{{ url_for('public.home') }}" class="brand">
        <img src="{{ url_for('static', filename='img/emblem.png') }}" alt="" style="width:44px;height:44px">
        <span class="wm"><b style="font-family:var(--display);font-weight:800;font-size:1.3rem;color:var(--navy)">PELIVET</b></span>
      </a>
      <h1>Admin sign in</h1>
      <p>Manage bookings, messages and clinic activity.</p>
      <form method="POST" novalidate>
        {{ form.hidden_tag() }}
        {{ form.username.label }}{{ form.username(placeholder='admin') }}
        {{ form.password.label }}{{ form.password(placeholder='••••••••') }}
        <button type="submit" class="btn btn-primary">Sign in {{ icon('arrow') }}</button>
      </form>
    </div>
  </div>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
